behaviors:
  Tetris:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 40960 # try 20480 later (or even 10240)
      learning_rate: 2.0e-4
      beta: 0.005 # try 0.01 later
      beta_schedule: constant
      epsilon: 0.2
      epsilon_schedule: linear
      lambd: 0.95
      num_epoch: 4
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
        network_settings:
          normalize: true
          hidden_units: 256
          num_layers: 2
    time_horizon: 256
    max_steps: 50000000
    checkpoint_interval: 100000
    summary_freq: 10000
    keep_checkpoints: 5


